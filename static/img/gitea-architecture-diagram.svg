<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2570ab"/>
    </marker>
  </defs>
  <rect width="900" height="360" rx="14" fill="#ffffff"/>

  <!-- Developer laptops -->
  <rect x="20" y="125" width="190" height="100" rx="12" fill="#e8f3fc" stroke="#3d9be0" stroke-width="2"/>
  <text x="115" y="165" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b3a5c">Developer laptops</text>
  <text x="115" y="190" text-anchor="middle" font-size="13" fill="#0b3a5c">repo checkout and build</text>

  <!-- Android build -->
  <rect x="20" y="285" width="190" height="55" rx="12" fill="#e8f3fc" stroke="#3d9be0" stroke-width="2"/>
  <text x="115" y="318" text-anchor="middle" font-size="16" font-weight="bold" fill="#0b3a5c">Android 12 build</text>
  <line x1="115" y1="225" x2="115" y2="285" stroke="#2570ab" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tailscale -->
  <rect x="300" y="150" width="160" height="60" rx="30" fill="#d3ecfc" stroke="#3d9be0" stroke-width="2"/>
  <text x="380" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b3a5c">Tailscale</text>
  <text x="380" y="197" text-anchor="middle" font-size="13" fill="#0b3a5c">private network</text>

  <!-- Arrows -->
  <line x1="210" y1="175" x2="300" y2="175" stroke="#2570ab" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="255" y="165" text-anchor="middle" font-size="12" fill="#0b3a5c">SSH</text>
  <text x="255" y="196" text-anchor="middle" font-size="11" fill="#0b3a5c">repo sync</text>
  <path d="M460,180 L520,180 L520,100 L580,100" fill="none" stroke="#2570ab" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ubuntu server -->
  <rect x="550" y="25" width="330" height="310" rx="14" fill="#f5faff" stroke="#3d9be0" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="715" y="52" text-anchor="middle" font-size="15" font-weight="bold" fill="#2570ab">Ubuntu server</text>

  <rect x="580" y="70" width="270" height="62" rx="10" fill="#ffffff" stroke="#3d9be0" stroke-width="2"/>
  <text x="715" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#0b3a5c">Gitea</text>
  <text x="715" y="118" text-anchor="middle" font-size="12" fill="#0b3a5c">Git over SSH, native install</text>

  <rect x="580" y="155" width="270" height="52" rx="10" fill="#ffffff" stroke="#3d9be0" stroke-width="2"/>
  <text x="715" y="187" text-anchor="middle" font-size="15" fill="#0b3a5c">PostgreSQL database</text>

  <rect x="580" y="232" width="270" height="82" rx="10" fill="#ffffff" stroke="#3d9be0" stroke-width="2"/>
  <text x="715" y="262" text-anchor="middle" font-size="16" font-weight="bold" fill="#0b3a5c">Android_OS_Lab</text>
  <text x="715" y="284" text-anchor="middle" font-size="12" fill="#0b3a5c">1,087 repositories + manifest</text>
  <text x="715" y="302" text-anchor="middle" font-size="11" fill="#0b3a5c">original checkout kept in /srv/aosp</text>

  <line x1="715" y1="132" x2="715" y2="155" stroke="#2570ab" stroke-width="2"/>
  <line x1="715" y1="207" x2="715" y2="232" stroke="#2570ab" stroke-width="2"/>
</svg>
